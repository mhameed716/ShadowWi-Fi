name: بناء تطبيق Android (APK)

# يُبنى تلقائياً عند كل رفع + يمكن تشغيله يدوياً من تبويب Actions
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء نسخة Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: جلب الحزم
        run: set -o pipefail && flutter pub get 2>&1 | tee ci_pubget.log

      - name: تشغيل الاختبارات
        run: set -o pipefail && flutter test --reporter github 2>&1 | tee ci_test.log

      - name: بناء APK (Release)
        run: set -o pipefail && flutter build apk --release 2>&1 | tee ci_build.log

      - name: تشخيص أي فشل
        if: failure()
        run: |
          # نُصدر بضعة أسطر فقط (حد GitHub = 10 لكل خطوة):
          if [ -f ci_build.log ]; then
            # 1) أخطاء Dart/Kotlin الفعلية (مطبوعة قبل قسم What went wrong)
            grep -m 6 -E "\.dart:[0-9]+:[0-9]+: Error|\.kt:[0-9]+:[0-9]+: error|error: |Error: " ci_build.log |
              while IFS= read -r line; do
                echo "::error::ERR|${line:0:700}"
              done
            # 2) أسطر الأسباب من What went wrong
            awk '/\* What went wrong:/{flag=1; next} flag && /^> /{print; count++} flag && /^$/{exit} count>5{exit}' ci_build.log |
              while IFS= read -r line; do
                echo "::error::${line:0:800}"
              done
            # 3) ذيل السجل
            tail -n 2 ci_build.log | while IFS= read -r line; do
              echo "::error::TAIL|${line:0:700}"
            done
          fi
          # قسم الاستثناء من سجل الاختبار + آخر الأسطر (بعد فك \r)
          if [ -f ci_test.log ]; then
            tr '\r' '\n' < ci_test.log | grep -v '^[[:space:]]*$' > /tmp/test_clean.log
            awk '/EXCEPTION CAUGHT BY|Test failed|Expected:|Actual:|Which:|The following|was thrown/{print; count++} count>=8{exit}' /tmp/test_clean.log |
              while IFS= read -r line; do
                echo "::error::EXC|${line:0:600}"
              done
            tail -n 3 /tmp/test_clean.log | while IFS= read -r line; do
              echo "::error::T|${line:0:600}"
            done
          fi

      - name: تجهيز ملف التوزيع
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | cut -d'+' -f1 | tr -d ' ')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/shadowwifi-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: رفع الملف كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowWi-Fi-APK-${{ env.APK_VERSION }}
          path: dist/shadowwifi-*.apk
          if-no-files-found: error

      - name: نشر إصدار برابط تحميل مباشر فريد
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="v${APK_VERSION}"
          FILE="dist/shadowwifi-v${APK_VERSION}.apk"
          NOTES="بناء تلقائي @ ${GITHUB_SHA::7} — تحميل: shadowwifi-v${APK_VERSION}.apk"
          # ثلاث محاولات مع مهل — يكفي أن تنجح واحدة
          for attempt in 1 2 3; do
            if gh release create "$TAG" "$FILE" \
                 --target "$GITHUB_SHA" \
                 --title "ShadowWi-Fi ${TAG}" \
                 --notes "$NOTES" \
                 --latest 2>&1 | tee publish.log; then
              break
            fi
            echo "محاولة $attempt فشلت — إعادة بعد 15 ثانية..."
            sleep 15
            # إن أُنشئ الوسم دون رفع الملف نرفع الملف على الإصدار القائم
            gh release upload "$TAG" "$FILE" --clobber 2>&1 | tee -a publish.log && break
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
