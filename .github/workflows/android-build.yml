name: بناء تطبيق Android (APK)

# ⛔ معطّل مؤقتاً — تشغيل يدوي فقط حتى إشعارك
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء نسخة Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: جلب الحزم
        run: set -o pipefail && flutter pub get 2>&1 | tee ci_pubget.log

      - name: تشغيل الاختبارات
        run: set -o pipefail && flutter test --reporter github 2>&1 | tee ci_test.log

      - name: بناء APK (Release)
        run: set -o pipefail && flutter build apk --release 2>&1 | tee ci_build.log

      - name: تشخيص أي فشل
        if: failure()
        run: |
          # نُصدر بضعة أسطر فقط (حد GitHub = 10 لكل خطوة):
          # أسطر الأسباب ">" من قسم What went wrong + آخر سطرين من سجل البناء.
          if [ -f ci_build.log ]; then
            awk '/\* What went wrong:/{flag=1; next} flag && /^> /{print; count++} flag && /^$/{exit} count>6{exit}' ci_build.log |
              while IFS= read -r line; do
                echo "::error::${line:0:800}"
              done
            echo "::error::(آخر سطر في السجل)"
            tail -n 2 ci_build.log | while IFS= read -r line; do
              echo "::error::TAIL|${line:0:700}"
            done
          fi
          # قسم الاستثناء من سجل الاختبار + آخر الأسطر (بعد فك \r)
          if [ -f ci_test.log ]; then
            tr '\r' '\n' < ci_test.log | grep -v '^[[:space:]]*$' > /tmp/test_clean.log
            awk '/EXCEPTION CAUGHT BY|Test failed|Expected:|Actual:|Which:|The following|was thrown/{print; count++} count>=8{exit}' /tmp/test_clean.log |
              while IFS= read -r line; do
                echo "::error::EXC|${line:0:600}"
              done
            tail -n 3 /tmp/test_clean.log | while IFS= read -r line; do
              echo "::error::T|${line:0:600}"
            done
          fi

      - name: تجهيز ملف التوزيع
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/shadowwifi-release.apk
          ls -lh dist/

      - name: رفع الملف كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowWi-Fi-APK
          path: dist/shadowwifi-release.apk
          if-no-files-found: error

      - name: نشر نسخة برابط تحميل مباشر
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest dist/shadowwifi-release.apk \
            --target "$GITHUB_SHA" \
            --title "ShadowWi-Fi — أحدث نسخة" \
            --notes "بناء تلقائي (${GITHUB_REF#refs/heads/} @ ${GITHUB_SHA::7}) — حمّل shadowwifi-release.apk" \
            --latest || true
          gh release upload latest dist/shadowwifi-release.apk --clobber
          gh release view latest --json assets --jq '.assets[].name'
